# The shell is presentation. These rules are the ones that catch logic moving
# into it, and the ones that keep a file small enough to read in one screen.
only_rules:
  - closure_spacing
  - colon
  - comma
  - cyclomatic_complexity
  - empty_count
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - implicitly_unwrapped_optional
  - line_length
  - trailing_whitespace
  - unused_import
  - vertical_whitespace

# Derived data is not source. Xcode writes an asset symbol file into the build
# directory whose lines are as long as the asset names, and linting a file the
# build generated tells nobody anything about this shell.
excluded:
  - build
  - NoxShield/Generated

file_length:
  warning: 70
  error: 90

function_body_length:
  warning: 40
  error: 60

line_length:
  warning: 100
  error: 120

cyclomatic_complexity:
  warning: 8
